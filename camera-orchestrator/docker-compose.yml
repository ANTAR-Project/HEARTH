services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: ha-postgres
    environment:
      POSTGRES_DB: homeassistant
      POSTGRES_USER: ha_app
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - antar-network
    restart: unless-stopped

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: ha-mosquitto
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    ports:
      - "1883:1883"
      - "9001:9001"
    networks:
      - antar-network
    restart: unless-stopped

  camera-media-service:
    image: alexxit/go2rtc:latest
    container_name: ha-go2rtc
    volumes:
      - ./go2rtc.yaml:/config/go2rtc.yaml
    ports:
      - "1984:1984"
      - "8554:8554"
      - "8555:8555/tcp"
      - "8555:8555/udp"
    networks:
      - antar-network
    restart: unless-stopped

  home-assistant-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ha-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-default}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=homeassistant
      - DB_USER=ha_app
      - DB_PASSWORD=${DB_PASSWORD}
      - MQTT_HOST=mosquitto
      - MQTT_PORT=1883
      - MQTT_USERNAME=ha_app
      - MQTT_PASSWORD=${MQTT_PASSWORD}
      - GO2RTC_URL=http://camera-media-service:1984
      - CAMERA_DEFAULT_IP=${CAMERA_DEFAULT_IP}
      - CAMERA_PASSWORD=${CAMERA_PASSWORD}
      - VIDEO_SERVICE_URL=http://video-service:8082
      - NAS_ORCHESTRATOR_URL=http://nas-orchestrator:8081
      - STREAMING_SERVICE_URL=http://streaming-service:8084
    networks:
      - antar-network
    depends_on:
      - postgres
      - mosquitto
      - camera-media-service
    restart: unless-stopped

volumes:
  pgdata:

networks:
  antar-network:
    driver: bridge
