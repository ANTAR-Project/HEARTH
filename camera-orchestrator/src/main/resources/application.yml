server:
  port: 8080
  tomcat:
    max-swallow-size: -1
    max-http-form-post-size: 2GB

spring:
  application:
    name: home-assistant-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  servlet:
    multipart:
      enabled: true
      max-file-size: 2GB
      max-request-size: 2GB
      file-size-threshold: 2MB
      location: /tmp

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:homeassistant}
    username: ${DB_USER:ha_app}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 25

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  cache:
    type: caffeine
    cache-names:
      - entityStates
      - devices
      - areas
    caffeine:
      spec: maximumSize=10000,expireAfterAccess=24h

# MQTT Broker Configuration
mqtt:
  enabled: ${MQTT_ENABLED:true}
  broker-url: tcp://${MQTT_HOST:localhost}:${MQTT_PORT:1883}
  client-id: ${MQTT_CLIENT_ID:ha_backend_server}
  username: ${MQTT_USERNAME:ha_app}
  password: ${MQTT_PASSWORD}
  default-qos: 1
  completion-timeout: 5000
  topics:
    inbound-telemetry: "devices/+/telemetry"
    inbound-status: "devices/+/status"
    outbound-set-pattern: "devices/%s/set"

# Camera Adapter Configuration (VLAN 30)
camera:
  enabled: ${CAMERA_ENABLED:true}
  default-ip: ${CAMERA_DEFAULT_IP}
  rtsp-port: ${CAMERA_RTSP_PORT:5543}
  http-port: ${CAMERA_HTTP_PORT:8000}
  username: ${CAMERA_USERNAME:admin}
  password: ${CAMERA_PASSWORD}
  substream-path: "/live/channel1"
  mainstream-path: "/live/channel0"
  snapshot-path: "/cgi-bin/snapshot.cgi?channel=1"
  poll-interval-ms: 15000
  subnet: ${CAMERA_SUBNET}
  motion-reset-seconds: 15
  go2rtc-url: ${GO2RTC_URL:http://localhost:1984}
  onvif-profile-token: ${CAMERA_ONVIF_PROFILE:PROFILE_1676656330}
  video-service-url: ${VIDEO_SERVICE_URL:http://localhost:8082}
  nas-orchestrator-url: ${NAS_ORCHESTRATOR_URL:http://localhost:8081}
  streaming-service-url: ${STREAMING_SERVICE_URL:http://localhost:8084}

# BLE Adapter Configuration
ble:
  enabled: ${BLE_ENABLED:true}
  adapter-name: ${BLE_ADAPTER_NAME:hci0}
  scan-interval-ms: ${BLE_SCAN_INTERVAL_MS:5000}
  rssi-threshold: ${BLE_RSSI_THRESHOLD:-90}
  timeout-seconds: ${BLE_TIMEOUT_SECONDS:120}
  topics:
    inbound-pattern: "ble/+/telemetry"
    outbound-write-pattern: "ble/%s/write"

# Zigbee Coordinator Configuration
zigbee:
  enabled: ${ZIGBEE_ENABLED:true}
  pan-id: ${ZIGBEE_PAN_ID:0x1A62}
  channel: ${ZIGBEE_CHANNEL:15}
  coordinator-ieee: ${ZIGBEE_COORDINATOR_IEEE:00:12:4B:00:1C:DF:88:99}
  permit-join-duration-seconds: ${ZIGBEE_PERMIT_JOIN_DURATION:180}
  topics:
    inbound-pattern: "zigbee2mqtt/+"
    outbound-set-pattern: "zigbee2mqtt/%s/set"
    permit-join: "zigbee2mqtt/bridge/request/permit_join"

# Actuator & Management
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
