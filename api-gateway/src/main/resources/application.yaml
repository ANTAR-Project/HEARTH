spring:
  kafka:
    bootstrap-servers: kafka:29092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false

  data:
    redis:
      host: redis
      port: 6379
      url: redis://redis:6379

  cloud:
    gateway:
      filter:
        retry:
          enabled: false
      server:
        webflux:
          httpclient:
            connect-timeout: 2000
          routes:

            # ─────────────────────────────────────────────
            # AUTH SERVICE  (auth-service:9000)
            # ─────────────────────────────────────────────

            - id: auth-login
              uri: http://auth-service:9000
              predicates: [Path=/api/v1/auth/login, Method=POST]
              metadata:
                hearth: { public: true }

            - id: auth-refresh
              uri: http://auth-service:9000
              predicates: [Path=/api/v1/auth/refresh, Method=POST]
              metadata:
                hearth: { public: true }

            - id: auth-logout
              uri: http://auth-service:9000
              predicates: [Path=/api/v1/auth/logout, Method=POST]
              metadata:
                hearth:
                  bypass-policy: true   # JWT verified; no policy check needed
                  audience: auth-service
                  intent: user.session.logout
                  action: DELETE
                  domain: USER
                  resourceType: ACCOUNT
                  resourceId: "{username}"
                  namespace: OWN

            - id: auth-users-create
              uri: http://auth-service:9000
              predicates: [Path=/api/v1/auth/users, Method=POST]
              metadata:
                hearth:
                  bypass-policy: true   # role-level guard is enforced inside AuthController
                  audience: auth-service
                  intent: user.account.create
                  action: CREATE
                  domain: USER
                  resourceType: ACCOUNT
                  resourceId: "{username}"
                  namespace: OWN

            - id: auth-users-list
              uri: http://auth-service:9000
              predicates: [Path=/api/v1/auth/users, Method=GET]
              metadata:
                hearth:
                  bypass-policy: true
                  audience: auth-service
                  intent: user.account.list
                  action: LIST
                  domain: USER
                  resourceType: ACCOUNT
                  resourceId: "{username}"
                  namespace: OWN

            - id: auth-jwks
              uri: http://auth-service:9000
              predicates: [Path=/.well-known/jwks.json, Method=GET]
              metadata:
                hearth: { public: true }

            # ─────────────────────────────────────────────
            # NAS ORCHESTRATOR  (nas-orchestrator:8081)
            # Public path prefix: /api/v1/nas/
            # Service path prefix: /api/v1/nas-orchestrator/
            # ─────────────────────────────────────────────

            - id: nas-files-list
              uri: http://nas-orchestrator:9002
              predicates: [Path=/api/v1/nas/files/list, Method=GET]
              filters:
                - RewritePath=/api/v1/nas/(?<seg>.*), /api/v1/nas-orchestrator/${seg}
              metadata:
                hearth:
                  intent: nas.workspace.list
                  action: LIST
                  domain: NAS
                  audience: nas-orchestrator
                  resourceType: WORKSPACE
                  resourceId: "{username}"
                  namespace: OWN

            - id: nas-files-download
              uri: http://nas-orchestrator:9002
              predicates: [Path=/api/v1/nas/files/download, Method=GET]
              filters:
                - RewritePath=/api/v1/nas/(?<seg>.*), /api/v1/nas-orchestrator/${seg}
              metadata:
                hearth:
                  intent: nas.workspace.read
                  action: READ
                  domain: NAS
                  audience: nas-orchestrator
                  resourceType: WORKSPACE
                  resourceId: "{username}"
                  namespace: OWN

            - id: nas-files-preview
              uri: http://nas-orchestrator:9002
              predicates: [Path=/api/v1/nas/files/preview, Method=GET]
              filters:
                - RewritePath=/api/v1/nas/(?<seg>.*), /api/v1/nas-orchestrator/${seg}
              metadata:
                hearth:
                  intent: nas.workspace.read
                  action: READ
                  domain: NAS
                  audience: nas-orchestrator
                  resourceType: WORKSPACE
                  resourceId: "{username}"
                  namespace: OWN

            # Upload routes → nas.workspace.create (seed: NAS / OWNER|RESIDENT|GUEST / CREATE / WORKSPACE / OWN)
            - id: nas-files-upload-file
              uri: http://nas-orchestrator:9002
              predicates: [Path=/api/v1/nas/files/upload/file, Method=POST]
              filters:
                - RewritePath=/api/v1/nas/(?<seg>.*), /api/v1/nas-orchestrator/${seg}
              metadata:
                hearth:
                  intent: nas.workspace.create
                  action: CREATE
                  domain: NAS
                  audience: nas-orchestrator
                  resourceType: WORKSPACE
                  resourceId: "{username}"
                  namespace: OWN

            - id: nas-files-upload-folder
              uri: http://nas-orchestrator:9002
              predicates: [Path=/api/v1/nas/files/upload/folder, Method=POST]
              filters:
                - RewritePath=/api/v1/nas/(?<seg>.*), /api/v1/nas-orchestrator/${seg}
              metadata:
                hearth:
                  intent: nas.workspace.create
                  action: CREATE
                  domain: NAS
                  audience: nas-orchestrator
                  resourceType: WORKSPACE
                  resourceId: "{username}"
                  namespace: OWN

            - id: nas-files-mkdir
              uri: http://nas-orchestrator:9002
              predicates: [Path=/api/v1/nas/files/mkdir, Method=POST]
              filters:
                - RewritePath=/api/v1/nas/(?<seg>.*), /api/v1/nas-orchestrator/${seg}
              metadata:
                hearth:
                  intent: nas.workspace.create
                  action: CREATE
                  domain: NAS
                  audience: nas-orchestrator
                  resourceType: WORKSPACE
                  resourceId: "{username}"
                  namespace: OWN

            - id: nas-files-delete
              uri: http://nas-orchestrator:9002
              predicates: [Path=/api/v1/nas/files/delete, Method=DELETE]
              filters:
                - RewritePath=/api/v1/nas/(?<seg>.*), /api/v1/nas-orchestrator/${seg}
              metadata:
                hearth:
                  intent: nas.workspace.delete
                  action: DELETE
                  domain: NAS
                  audience: nas-orchestrator
                  resourceType: WORKSPACE
                  resourceId: "{username}"
                  namespace: OWN

            # ── Shared workspace routes ──────────────────────────────────────────
            # resource_type stays WORKSPACE; namespace=SHARED drives scope matching.
            # ownership:SELF condition in seed means only the caller's own items in shared space.

            - id: nas-shared-list
              uri: http://nas-orchestrator:9002
              predicates: [Path=/api/v1/nas/shared/list, Method=GET]
              filters:
                - RewritePath=/api/v1/nas/(?<seg>.*), /api/v1/nas-orchestrator/${seg}
              metadata:
                hearth:
                  intent: nas.workspace.list
                  action: LIST
                  domain: NAS
                  audience: nas-orchestrator
                  resourceType: WORKSPACE
                  resourceId: "shared"
                  namespace: SHARED

            - id: nas-shared-download
              uri: http://nas-orchestrator:9002
              predicates: [Path=/api/v1/nas/shared/download, Method=GET]
              filters:
                - RewritePath=/api/v1/nas/(?<seg>.*), /api/v1/nas-orchestrator/${seg}
              metadata:
                hearth:
                  intent: nas.workspace.read
                  action: READ
                  domain: NAS
                  audience: nas-orchestrator
                  resourceType: WORKSPACE
                  resourceId: "shared"
                  namespace: SHARED

            - id: nas-shared-preview
              uri: http://nas-orchestrator:9002
              predicates: [Path=/api/v1/nas/shared/preview, Method=GET]
              filters:
                - RewritePath=/api/v1/nas/(?<seg>.*), /api/v1/nas-orchestrator/${seg}
              metadata:
                hearth:
                  intent: nas.workspace.read
                  action: READ
                  domain: NAS
                  audience: nas-orchestrator
                  resourceType: WORKSPACE
                  resourceId: "shared"
                  namespace: SHARED

            # Shared uploads → CREATE with ownership:SELF enforced by engine
            - id: nas-shared-upload-file
              uri: http://nas-orchestrator:9002
              predicates: [Path=/api/v1/nas/shared/upload/file, Method=POST]
              filters:
                - RewritePath=/api/v1/nas/(?<seg>.*), /api/v1/nas-orchestrator/${seg}
              metadata:
                hearth:
                  intent: nas.workspace.create
                  action: CREATE
                  domain: NAS
                  audience: nas-orchestrator
                  resourceType: WORKSPACE
                  resourceId: "shared"
                  namespace: SHARED

            - id: nas-shared-upload-folder
              uri: http://nas-orchestrator:9002
              predicates: [Path=/api/v1/nas/shared/upload/folder, Method=POST]
              filters:
                - RewritePath=/api/v1/nas/(?<seg>.*), /api/v1/nas-orchestrator/${seg}
              metadata:
                hearth:
                  intent: nas.workspace.create
                  action: CREATE
                  domain: NAS
                  audience: nas-orchestrator
                  resourceType: WORKSPACE
                  resourceId: "shared"
                  namespace: SHARED

            - id: nas-shared-mkdir
              uri: http://nas-orchestrator:9002
              predicates: [Path=/api/v1/nas/shared/mkdir, Method=POST]
              filters:
                - RewritePath=/api/v1/nas/(?<seg>.*), /api/v1/nas-orchestrator/${seg}
              metadata:
                hearth:
                  intent: nas.workspace.create
                  action: CREATE
                  domain: NAS
                  audience: nas-orchestrator
                  resourceType: WORKSPACE
                  resourceId: "shared"
                  namespace: SHARED

            # Shared deletes → DELETE with ownership:SELF enforced by engine
            - id: nas-shared-delete
              uri: http://nas-orchestrator:9002
              predicates: [Path=/api/v1/nas/shared/delete, Method=DELETE]
              filters:
                - RewritePath=/api/v1/nas/(?<seg>.*), /api/v1/nas-orchestrator/${seg}
              metadata:
                hearth:
                  intent: nas.workspace.delete
                  action: DELETE
                  domain: NAS
                  audience: nas-orchestrator
                  resourceType: WORKSPACE
                  resourceId: "shared"
                  namespace: SHARED

            - id: nas-shared-clear
              uri: http://nas-orchestrator:9002
              predicates: [Path=/api/v1/nas/shared/clear, Method=DELETE]
              filters:
                - RewritePath=/api/v1/nas/(?<seg>.*), /api/v1/nas-orchestrator/${seg}
              metadata:
                hearth:
                  intent: nas.workspace.delete
                  action: DELETE
                  domain: NAS
                  audience: nas-orchestrator
                  resourceType: WORKSPACE
                  resourceId: "shared"
                  namespace: SHARED

            - id: nas-workspace-create
              uri: http://nas-orchestrator:9002
              predicates: [Path=/api/v1/nas/workspace/create, Method=POST]
              filters:
                - RewritePath=/api/v1/nas/(?<seg>.*), /api/v1/nas-orchestrator/${seg}
              metadata:
                hearth:
                  intent: nas.workspace.create
                  action: CREATE
                  domain: NAS
                  audience: nas-orchestrator
                  resourceType: WORKSPACE
                  resourceId: "{username}"
                  namespace: OWN

            - id: nas-workspace-delete
              uri: http://nas-orchestrator:9002
              predicates: [Path=/api/v1/nas/workspace/delete, Method=DELETE]
              filters:
                - RewritePath=/api/v1/nas/(?<seg>.*), /api/v1/nas-orchestrator/${seg}
              metadata:
                hearth:
                  intent: nas.workspace.delete
                  action: DELETE
                  domain: NAS
                  audience: nas-orchestrator
                  resourceType: WORKSPACE
                  resourceId: "{username}"
                  namespace: OWN

            - id: nas-workspace-clear
              uri: http://nas-orchestrator:9002
              predicates: [Path=/api/v1/nas/workspace/clear, Method=DELETE]
              filters:
                - RewritePath=/api/v1/nas/(?<seg>.*), /api/v1/nas-orchestrator/${seg}
              metadata:
                hearth:
                  intent: nas.workspace.delete
                  action: DELETE
                  domain: NAS
                  audience: nas-orchestrator
                  resourceType: WORKSPACE
                  resourceId: "{username}"
                  namespace: OWN

            - id: nas-workspace-info
              uri: http://nas-orchestrator:9002
              predicates: [Path=/api/v1/nas/workspace/info, Method=GET]
              filters:
                - RewritePath=/api/v1/nas/(?<seg>.*), /api/v1/nas-orchestrator/${seg}
              metadata:
                hearth:
                  intent: nas.workspace.read
                  action: READ
                  domain: NAS
                  audience: nas-orchestrator
                  resourceType: WORKSPACE
                  resourceId: "{username}"
                  namespace: OWN

            # ── HLS streaming (/api/v1/nas/stream/…) ────────────────────────────
            # Media player clients (Video.js, hls.js, native Safari) fetch playlists
            # and .ts segments using query param URLs (?token=...), not Authorization headers.
            # Gateway passes through (public: true); nas-orchestrator handles streaming.

            - id: nas-stream-playlist
              uri: http://nas-orchestrator:9002
              predicates: [Path=/api/v1/nas/stream/playlist, Method=GET]
              filters:
                - RewritePath=/api/v1/nas/(?<seg>.*), /api/v1/nas-orchestrator/${seg}
              metadata:
                hearth:
                  public: true

            - id: nas-stream-segment
              uri: http://nas-orchestrator:9002
              predicates: [Path=/api/v1/nas/stream/segment, Method=GET]
              filters:
                - RewritePath=/api/v1/nas/(?<seg>.*), /api/v1/nas-orchestrator/${seg}
              metadata:
                hearth:
                  public: true

            # Direct pass-through for rewritten URLs emitted by nas-orchestrator StreamingService
            - id: nas-orchestrator-stream-playlist
              uri: http://nas-orchestrator:9002
              predicates: [Path=/api/v1/nas-orchestrator/stream/playlist, Method=GET]
              metadata:
                hearth:
                  public: true

            - id: nas-orchestrator-stream-segment
              uri: http://nas-orchestrator:9002
              predicates: [Path=/api/v1/nas-orchestrator/stream/segment, Method=GET]
              metadata:
                hearth:
                  public: true

            # ─────────────────────────────────────────────
            # VIDEO SERVICE  (video-service:9004)
            # ─────────────────────────────────────────────

            # Video upload writes into the caller's OWN workspace → nas.workspace.create
            - id: video-upload
              uri: http://video-service:9004
              predicates: [Path=/api/v1/videos/upload, Method=POST]
              metadata:
                hearth:
                  intent: nas.workspace.create
                  action: CREATE
                  domain: NAS
                  audience: video-service
                  resourceType: WORKSPACE
                  resourceId: "{username}"
                  namespace: OWN

            # ─────────────────────────────────────────────
            # STREAMING SERVICE  (streaming-service:9006)
            # /stream routes fetch media files from the caller's OWN workspace
            # → treated as WORKSPACE READs (same as nas-stream-* above).
            # ─────────────────────────────────────────────

            - id: streaming-root
              uri: http://streaming-service:9006
              predicates: [Path=/api/v1/stream, Method=GET]
              metadata:
                hearth:
                  intent: nas.workspace.read
                  action: READ
                  domain: NAS
                  audience: streaming-service
                  resourceType: WORKSPACE
                  resourceId: "{username}"
                  namespace: OWN

            - id: streaming-playlists
              uri: http://streaming-service:9006
              predicates: [Path=/api/v1/stream/playlists, Method=GET]
              metadata:
                hearth:
                  intent: nas.workspace.read
                  action: READ
                  domain: NAS
                  audience: streaming-service
                  resourceType: WORKSPACE
                  resourceId: "{username}"
                  namespace: OWN

            # ─────────────────────────────────────────────
            # ELEMENT REGISTRY  (element-registry:9003)
            # intent names match seed: element.element.{control|read}
            # ─────────────────────────────────────────────

            - id: element-state
              uri: http://element-registry:9003
              predicates: ["Path=/api/v1/elements/{elementId}/state", Method=PUT]
              metadata:
                hearth:
                  intent: element.element.control
                  action: CONTROL
                  domain: ELEMENT
                  audience: element-registry
                  resourceType: ELEMENT
                  resourceId: "{elementId}"
                  namespace: OWN

            - id: element-read
              uri: http://element-registry:9003
              predicates: ["Path=/api/v1/elements/{elementId}", Method=GET]
              metadata:
                hearth:
                  intent: element.element.read
                  action: READ
                  domain: ELEMENT
                  audience: element-registry
                  resourceType: ELEMENT
                  resourceId: "{elementId}"
                  namespace: OWN

            # ─────────────────────────────────────────────
            # NOTIFICATION SERVICE  (notification-service:9007)
            # WebSocket — notification-service handles its own upgrade auth
            # ─────────────────────────────────────────────

            - id: ws-notifications
              uri: ws://notification-service:9007
              predicates: [Path=/ws/notifications]
              metadata:
                hearth: { public: true }

            # ─────────────────────────────────────────────
            # CAMERA ORCHESTRATOR  (camera-orchestrator:9008)
            # ─────────────────────────────────────────────

            - id: camera-status
              uri: http://camera-orchestrator:9008
              predicates: [Path=/api/v1/camera/status, Method=GET]
              filters:
                - RewritePath=/api/v1/(?<seg>.*), /api/${seg}
              metadata:
                hearth:
                  intent: element.camera.read
                  action: READ
                  domain: ELEMENT
                  audience: camera-orchestrator
                  resourceType: ELEMENT
                  resourceId: "camera"
                  qualifier: CAMERA
                  namespace: OWN

            - id: camera-snapshot
              uri: http://camera-orchestrator:9008
              predicates: ["Path=/api/v1/camera/{entityId}/snapshot", Method=GET]
              filters:
                - RewritePath=/api/v1/(?<seg>.*), /api/${seg}
              metadata:
                hearth:
                  intent: element.camera.read
                  action: READ
                  domain: ELEMENT
                  audience: camera-orchestrator
                  resourceType: ELEMENT
                  resourceId: "{entityId}"
                  qualifier: CAMERA
                  namespace: OWN

            - id: camera-stream-url
              uri: http://camera-orchestrator:9008
              predicates: ["Path=/api/v1/camera/{entityId}/stream-url", Method=GET]
              filters:
                - RewritePath=/api/v1/(?<seg>.*), /api/${seg}
              metadata:
                hearth:
                  intent: element.camera.read
                  action: READ
                  domain: ELEMENT
                  audience: camera-orchestrator
                  resourceType: ELEMENT
                  resourceId: "{entityId}"
                  qualifier: CAMERA
                  namespace: OWN

            - id: camera-webrtc
              uri: http://camera-orchestrator:9008
              predicates: ["Path=/api/v1/camera/{entityId}/webrtc", Method=POST]
              filters:
                - RewritePath=/api/v1/(?<seg>.*), /api/${seg}
              metadata:
                hearth:
                  intent: element.camera.stream
                  action: STREAM
                  domain: ELEMENT
                  audience: camera-orchestrator
                  resourceType: ELEMENT
                  resourceId: "{entityId}"
                  qualifier: CAMERA
                  namespace: OWN

            - id: camera-live-media
              uri: http://camera-orchestrator:9008
              predicates: ["Path=/api/v1/camera/{entityId}/stream,/api/v1/camera/{entityId}/live/**", Method=GET]
              filters:
                - RewritePath=/api/v1/(?<seg>.*), /api/${seg}
              metadata:
                hearth: { public: true }

            - id: camera-ptz
              uri: http://camera-orchestrator:9008
              predicates: ["Path=/api/v1/camera/{entityId}/ptz", Method=POST]
              filters:
                - RewritePath=/api/v1/(?<seg>.*), /api/${seg}
              metadata:
                hearth:
                  intent: element.camera.control
                  action: CONTROL
                  domain: ELEMENT
                  audience: camera-orchestrator
                  resourceType: ELEMENT
                  resourceId: "{entityId}"
                  qualifier: CAMERA
                  namespace: OWN

            - id: camera-record
              uri: http://camera-orchestrator:9008
              predicates: ["Path=/api/v1/camera/{entityId}/record", Method=POST]
              filters:
                - RewritePath=/api/v1/(?<seg>.*), /api/${seg}
              metadata:
                hearth:
                  intent: element.camera.control
                  action: CONTROL
                  domain: ELEMENT
                  audience: camera-orchestrator
                  resourceType: ELEMENT
                  resourceId: "{entityId}"
                  qualifier: CAMERA
                  namespace: OWN

            - id: camera-motion
              uri: http://camera-orchestrator:9008
              predicates: ["Path=/api/v1/camera/{entityId}/motion", Method=POST]
              filters:
                - RewritePath=/api/v1/(?<seg>.*), /api/${seg}
              metadata:
                hearth:
                  intent: element.camera.control
                  action: CONTROL
                  domain: ELEMENT
                  audience: camera-orchestrator
                  resourceType: ELEMENT
                  resourceId: "{entityId}"
                  qualifier: CAMERA
                  namespace: OWN

            - id: camera-scan
              uri: http://camera-orchestrator:9008
              predicates: [Path=/api/v1/camera/scan, Method=POST]
              filters:
                - RewritePath=/api/v1/(?<seg>.*), /api/${seg}
              metadata:
                hearth:
                  intent: element.camera.control
                  action: CONTROL
                  domain: ELEMENT
                  audience: camera-orchestrator
                  resourceType: ELEMENT
                  resourceId: "camera"
                  qualifier: CAMERA
                  namespace: OWN

            - id: camera-recordings-read
              uri: http://camera-orchestrator:9008
              predicates: ["Path=/api/v1/camera/recordings,/api/v1/camera/recordings/{recordingId}/download,/api/v1/camera/recordings/{recordingId}/preview", Method=GET]
              filters:
                - RewritePath=/api/v1/(?<seg>.*), /api/${seg}
              metadata:
                hearth:
                  intent: nas.workspace.read
                  action: READ
                  domain: NAS
                  audience: camera-orchestrator
                  resourceType: WORKSPACE
                  resourceId: "{username}"
                  namespace: OWN

            - id: camera-recordings-hls
              uri: http://camera-orchestrator:9008
              predicates: ["Path=/api/v1/camera/recordings/{recordingId}/stream,/api/v1/camera/recordings/hls/**", Method=GET]
              filters:
                - RewritePath=/api/v1/(?<seg>.*), /api/${seg}
              metadata:
                hearth: { public: true }

            - id: camera-recordings-delete
              uri: http://camera-orchestrator:9008
              predicates: ["Path=/api/v1/camera/recordings/{recordingId}", Method=DELETE]
              filters:
                - RewritePath=/api/v1/(?<seg>.*), /api/${seg}
              metadata:
                hearth:
                  intent: nas.workspace.delete
                  action: DELETE
                  domain: NAS
                  audience: camera-orchestrator
                  resourceType: WORKSPACE
                  resourceId: "{username}"
                  namespace: OWN

            - id: camera-nas-list
              uri: http://camera-orchestrator:9008
              predicates: [Path=/api/v1/camera-nas/files, Method=GET]
              filters:
                - RewritePath=/api/v1/camera-nas/(?<seg>.*), /api/nas/${seg}
              metadata:
                hearth:
                  intent: nas.workspace.list
                  action: LIST
                  domain: NAS
                  audience: camera-orchestrator
                  resourceType: WORKSPACE
                  resourceId: "{username}"
                  namespace: OWN

            - id: camera-nas-read
              uri: http://camera-orchestrator:9008
              predicates: ["Path=/api/v1/camera-nas/preview,/api/v1/camera-nas/download", Method=GET]
              filters:
                - RewritePath=/api/v1/camera-nas/(?<seg>.*), /api/nas/${seg}
              metadata:
                hearth:
                  intent: nas.workspace.read
                  action: READ
                  domain: NAS
                  audience: camera-orchestrator
                  resourceType: WORKSPACE
                  resourceId: "{username}"
                  namespace: OWN

            - id: camera-nas-upload
              uri: http://camera-orchestrator:9008
              predicates: [Path=/api/v1/camera-nas/upload, Method=POST]
              filters:
                - RewritePath=/api/v1/camera-nas/(?<seg>.*), /api/nas/${seg}
              metadata:
                hearth:
                  intent: nas.workspace.create
                  action: CREATE
                  domain: NAS
                  audience: camera-orchestrator
                  resourceType: WORKSPACE
                  resourceId: "{username}"
                  namespace: OWN

            - id: camera-nas-delete
              uri: http://camera-orchestrator:9008
              predicates: [Path=/api/v1/camera-nas/files, Method=DELETE]
              filters:
                - RewritePath=/api/v1/camera-nas/(?<seg>.*), /api/nas/${seg}
              metadata:
                hearth:
                  intent: nas.workspace.delete
                  action: DELETE
                  domain: NAS
                  audience: camera-orchestrator
                  resourceType: WORKSPACE
                  resourceId: "{username}"
                  namespace: OWN

            - id: camera-elements-read
              uri: http://camera-orchestrator:9008
              predicates: ["Path=/api/v1/devices/**,/api/v1/states/**,/api/v1/areas/**,/api/v1/automations/**,/api/v1/adapters/**,/api/v1/history/**", Method=GET]
              filters:
                - RewritePath=/api/v1/(?<seg>.*), /api/${seg}
              metadata:
                hearth:
                  intent: element.element.read
                  action: READ
                  domain: ELEMENT
                  audience: camera-orchestrator
                  resourceType: ELEMENT
                  resourceId: "{username}"
                  namespace: OWN

            - id: camera-elements-control
              uri: http://camera-orchestrator:9008
              predicates: ["Path=/api/v1/devices/**,/api/v1/states/**,/api/v1/services/**,/api/v1/areas/**,/api/v1/automations/**,/api/v1/adapters/**", "Method=POST,DELETE"]
              filters:
                - RewritePath=/api/v1/(?<seg>.*), /api/${seg}
              metadata:
                hearth:
                  intent: element.element.control
                  action: CONTROL
                  domain: ELEMENT
                  audience: camera-orchestrator
                  resourceType: ELEMENT
                  resourceId: "{username}"
                  namespace: OWN

            - id: ws-camera-states
              uri: ws://camera-orchestrator:9008
              predicates: [Path=/ws/states]
              metadata:
                hearth: { public: true }

  codec:
    max-in-memory-size: 64KB

server:
  port: 8443

management:
  server:
    port: 8081
  endpoints:
    web:
      base-path: /internal
      exposure:
        include: jwks,health

hearth:
  auth:
    jwks-uri: http://auth-service:9000/.well-known/jwks.json
  gateway:
    keys-dir: ${GATEWAY_KEYS_DIR}
    current-kid: ${GATEWAY_CURRENT_KID}
  policy:
    endpoints:
      NAS: policy-registry:9001
      ELEMENT: policy-registry:9001
      USER: policy-registry:9001
